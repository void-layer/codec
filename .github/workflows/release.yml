name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a      # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413     # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1    # v7.1.0
        with: { node-version: 24, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with: { rustflags: "" }
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266   # v2
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack 0.14.0
        run: cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Push git tags
        run: git push origin --tags
      - name: Derive version
        id: ver
        run: echo "v=v$(node -p "require('./packages/codec/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          generate_release_notes: true
      - name: Obtain crates.io OIDC token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: crates-io-auth
      - name: Publish to crates.io
        run: cargo publish -p void-layer-codec
        working-directory: packages/codec
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
